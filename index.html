<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP7 슬롯 예약 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 동아리 장비실 게시판처럼 실용적이고 또렷하게.
   IDEA: SP7 앞판의 4×4 버튼 뱅크 — 칸이 LED처럼 켜진다.
   PICTURE: 키보드 패널 하나에 A~D 네 그룹 격자, 칸마다 상태색과 이름.
   COLOUR and TYPE: 차콜 패널, 사용 중 버밀리언, 예정 블루, 만료 빗금 회색 / Barlow Condensed 번호 + Noto Sans KR.
   LAYOUT: 제목·기체 탭·요약 → 패널 → 예약 목록 표. 600px 아래에선 그룹 2열, 다시 1열. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ee,#121212);--ink:light-dark(#1b1b1b,#ecebe8);--mute:light-dark(#6b6862,#9b9893);
--card:light-dark(#ffffff,#1c1c1c);--line:light-dark(#dedad4,#2e2e2e);
--panel:#232323;--panel2:#2c2c2c;--key:#383838;--keyink:#bdbab4;
--use:#ff4a1c;--soon:#3d8bff;--exp:#8a8780;--free:#3a3a3a;--focus:#ffb000}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px);max-width:1240px;margin:0 auto}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:44px;padding:0 18px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--panel);color:#fff}
.sum{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 14px;font-size:15px}
.sum b{font-family:"Barlow Condensed",sans-serif;font-size:22px;margin-right:4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:0}
.d-use{background:var(--use)}.d-soon{background:var(--soon)}.d-exp{background:repeating-linear-gradient(45deg,#8a8780 0 3px,#5a5853 3px 6px)}.d-free{background:var(--free);outline:1px solid #555}
.panel{background:linear-gradient(#2a2a2a,var(--panel));border-radius:18px;padding:clamp(14px,2.4vw,26px);box-shadow:0 1px 0 #444 inset,0 18px 40px -20px rgba(0,0,0,.6);color:#eee}
.phead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.04em}
.phead strong{font-size:22px}.phead span{color:#9a978f;font-size:15px}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,20px)}
.grp{background:var(--panel2);border-radius:12px;padding:10px;box-shadow:0 1px 0 #3a3a3a inset}
.grp h3{margin:0 0 8px;font:700 18px "Barlow Condensed",sans-serif;color:#d8d5cf;display:flex;justify-content:space-between}
.grp h3 small{font-weight:500;color:#8f8c85;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1/1;min-height:44px;border:0;border-radius:7px;background:var(--key);color:var(--keyink);cursor:pointer;padding:5px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font:inherit;box-shadow:0 2px 0 #1a1a1a,0 1px 0 #4a4a4a inset;transition:transform .08s}
.slot:active{transform:translateY(1px)}
.slot:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.slot .n{font:700 15px/1 "Barlow Condensed",sans-serif}
.slot .who{font-size:11.5px;line-height:1.2;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.slot.use{background:var(--use);color:#fff;box-shadow:0 2px 0 #9b2a0e,0 0 14px -2px rgba(255,74,28,.7)}
.slot.soon{background:var(--soon);color:#fff;box-shadow:0 2px 0 #1e4f9e,0 0 12px -3px rgba(61,139,255,.7)}
.slot.exp{background:repeating-linear-gradient(45deg,#6f6c66 0 6px,#5c5a55 6px 12px);color:#f0eee9}
.slot.sel{background:#f4f1ea;color:#1b1b1b;box-shadow:0 0 0 3px #fff,0 0 16px -2px rgba(255,255,255,.55)}
.slot.sel::after{content:"✓";position:absolute;top:4px;right:6px;font-weight:700;font-size:14px;color:var(--use)}
.gsel{margin-top:8px;width:100%;min-height:36px;border:1px dashed #5a5853;border-radius:8px;background:none;color:#cfccc5;font:inherit;font-size:13px;cursor:pointer}
.gsel:hover{border-color:#bdbab4;color:#fff}
.gfull{margin:8px 0 0;min-height:36px;display:grid;place-items:center;font-size:13px;color:#77746e}
.bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:#1b1b1b;color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:5}
.bar[hidden]{display:none}
.bar .txt{flex:1;display:flex;flex-direction:column;line-height:1.3}
.bar .txt b{font-size:16px}.bar .txt span{font-size:13px;color:#bdbab4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .btn{border-color:#555;color:#fff;flex:none}
body.hasbar{padding-bottom:96px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:15px;line-height:1.4;min-height:44px;padding-top:4px}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--use)}
.chk small{color:var(--mute);display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:14px;color:#bdbab4}
.note{font-size:14px;color:var(--mute);margin:10px 0 0}
.status{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;font-size:15px}
.status[hidden]{display:none}
h2{font-size:24px;margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.tools input[type=search]{min-height:44px;font:inherit;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(320px,100%)}
.tools label{display:flex;gap:6px;align-items:center;font-size:15px;min-height:44px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:500}
td.nw{white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:light-dark(#f7f5f2,#232323)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.t-use{background:var(--use)}.t-soon{background:var(--soon)}.t-exp{background:var(--exp)}
.empty{padding:24px;text-align:center;color:var(--mute)}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:10}
.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);border-radius:16px;width:min(440px,100%);padding:22px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 4px;font-size:22px}
.dlg .meta{color:var(--mute);font-size:14px;margin:0 0 16px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:14px;font-weight:500;margin-bottom:5px}
.fld input.pin{letter-spacing:.4em;font-family:"Barlow Condensed",sans-serif;font-size:20px;max-width:9em}
.fld input{width:100%;min-height:44px;font:inherit;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fld input:focus-visible,.tools input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.view dl{display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px;margin:0 0 18px}
.view dt{color:var(--mute);font-size:14px}.view dd{margin:0;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(--use);border-color:var(--use);color:#fff}
.btn.del{color:#d23c16;border-color:currentColor}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#d23c16;font-size:14px;min-height:1.2em;margin:0 0 10px}
main.band{padding-bottom:8px}
@media(max-width:900px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.groups{grid-template-columns:minmax(0,1fr)}.slot .who{font-size:12px}.row2{grid-template-columns:1fr}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:calc(12px + 6em);text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:5.5em;margin-inline-start:-6em;color:var(--mute)}.stack td:empty{display:none}.stack tr{border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){.slot{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<main class="band">
  <div class="top">
    <div>
      <h1>SP7 음색 슬롯 예약 현황</h1>
      <p class="sub">빈 칸을 여러 개 눌러 고른 뒤 한 번에 예약하세요. 신기체·구기체 각 64칸 (그룹 A~D × 16칸)</p>
    </div>
    <div class="tabs" role="tablist" aria-label="키보드 선택">
      <button role="tab" id="tab-new" data-kb="new" aria-selected="true">신기체</button>
      <button role="tab" id="tab-old" data-kb="old" aria-selected="false">구기체</button>
    </div>
  </div>

  <p class="status" id="status" hidden></p>

  <p class="sum" id="sum"></p>

  <section class="panel" aria-label="슬롯 패널">
    <div class="phead"><strong id="pname">SP7 신기체</strong><span id="pcount"></span></div>
    <div class="groups" id="groups"></div>
    <div class="legend">
      <span><i class="dot d-use"></i>사용 중</span>
      <span><i class="dot d-soon"></i>예약 (시작 전)</span>
      <span><i class="dot d-exp"></i>기간 만료</span>
      <span><i class="dot d-free"></i>비어 있음</span>
    </div>
  </section>
  <p class="note">예약할 때 정한 4자리 PIN으로 수정·취소해요. 기간 만료 칸은 누구나 "비우기"로 정리할 수 있어요. 현황은 30초마다 자동으로 새로 불러와요.</p>
</main>

<section class="band" aria-labelledby="lh">
  <h2 id="lh">예약 목록</h2>
  <div class="tools">
    <input type="search" id="q" placeholder="이름·목적·슬롯 검색" aria-label="예약 검색">
    <label><input type="checkbox" id="allkb" checked> 두 대 모두 보기</label>
    <label><input type="checkbox" id="hideexp"> 만료 숨기기</label>
  </div>
  <div id="list"></div>
</section>

<div class="bar" id="bar" role="region" aria-label="선택한 칸" hidden>
  <div class="txt" id="bartxt"></div>
  <button class="btn" id="bclear">선택 해제</button>
  <button class="btn pri" id="bres">예약하기</button>
</div>

<div class="ov" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt" id="dlg"></div>
</div>

<script>
{
/* ▼ Apps Script 웹 앱 주소를 여기에 붙여 넣으세요 (README 3단계) */
const API_URL = 'https://script.google.com/macros/s/AKfycbxZBOMV2H0_yk9_Ey0bEGanugDZY493zZaGKODFB9jGRRLQK1OKN2f0RwA1VVQH7r_1Vg/exec';

/* ---- 구글 시트(Apps Script) 연결 ---- */
const API={
  pin:true,busy:false,
  canEdit:()=>true, /* 권한은 PIN으로 서버가 확인 */
  async load(quiet){
    if(!API_URL){status('아직 시트와 연결되지 않았어요. index.html의 API_URL에 Apps Script 웹 앱 주소를 넣어 주세요.');return}
    if(this.busy)return;
    try{
      const res=await fetch(API_URL,{cache:'no-store'});const j=await res.json();
      if(!j.ok)throw new Error(j.error);
      setRows(j.rows);status('');
    }catch(e){if(!quiet||!ready)status('예약 정보를 불러오지 못했어요. 잠시 후 새로고침해 주세요.')}
  },
  async send(body){
    if(!API_URL)return{ok:false,error:'아직 시트와 연결되지 않아 저장할 수 없어요.'};
    this.busy=true;
    try{
      const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)}); /* text/plain → 사전 요청 없이 전송 */
      const j=await res.json();
      if(j.rows)setRows(j.rows);
      return j;
    }catch(e){return{ok:false,error:'서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'}}
    finally{this.busy=false}
  },
  reserve(keys,d){return this.send({action:'reserve',slots:keys.map(split),batch:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d})},
  update(keys,d){return this.send({action:'update',slots:keys.map(split),...d})},
  cancel(keys,pin){return this.send({action:'cancel',slots:keys.map(split),pin})},
  clear(keys){return this.send({action:'clear',slots:keys.map(split)})},
  init(){
    this.load();
    setInterval(()=>{if($('#ov').hidden&&!document.hidden)this.load(true);else render()},30000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.load(true)});
  }
};

/* ---- 공통 화면 (API 어댑터는 위에서 정의) ---- */
const KB={new:'SP7 신기체',old:'SP7 구기체'};
const GROUPS=['A','B','C','D'];
const PURPOSES=['정기 공연','외부 공연'];
let cur='new', rows={}, ready=false;
const sel=new Set();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>s?s.slice(2).replace(/-/g,'.'):'';
const key=(kb,slot)=>kb+'_'+slot;
const split=k=>{const i=k.indexOf('_');return{kb:k.slice(0,i),slot:k.slice(i+1)}};
const slotNum=s=>GROUPS.indexOf(s[0])*100+ +s.slice(1);
function state(r){if(!r)return'free';const t=today();if(r.end&&r.end<t)return'exp';if(r.start&&r.start>t)return'soon';return'use'}
const LABEL={use:'사용 중',soon:'예약',exp:'기간 만료',free:'비어 있음'};
const pinField=(id,label)=>`<label class="fld"><span>${label}</span><input id="${id}" class="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required></label>`;

/** 칸 목록을 "신기체 A1, A2 · 구기체 B3" 형태로 */
function describe(keys){
  const by={};keys.map(split).forEach(({kb,slot})=>(by[kb]=by[kb]||[]).push(slot));
  /* 연속된 3칸 이상은 C1~C16 처럼 줄임 */
  const runs=list=>{const s=list.sort((a,b)=>slotNum(a)-slotNum(b)),o=[];let i=0;
    while(i<s.length){let j=i;while(j+1<s.length&&slotNum(s[j+1])===slotNum(s[j])+1)j++;
      if(j-i>=2)o.push(s[i]+'~'+s[j]);else for(let x=i;x<=j;x++)o.push(s[x]);i=j+1}
    return o.join(', ')};
  return Object.keys(KB).filter(kb=>by[kb]).map(kb=>`${KB[kb].replace('SP7 ','')} ${runs(by[kb])}`).join(' · ');
}
function status(msg){const s=$('#status');if(msg){s.textContent=msg;s.hidden=false}else s.hidden=true}
function setRows(list){
  const n={};(list||[]).forEach(r=>{if(KB[r.kb])n[key(r.kb,r.slot)]=r});rows=n;ready=true;
  for(const k of [...sel])if(rows[k])sel.delete(k);
  render();
}
/** 같은 묶음(batch)으로 함께 예약된 칸들 */
function companions(k){const r=rows[k];if(!r||!r.batch)return[k];return Object.keys(rows).filter(x=>rows[x].batch===r.batch)}

/* ---- 화면 그리기 ---- */
function render(){
  $('#pname').textContent=KB[cur];
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.kb===cur));
  const c={use:0,soon:0,exp:0,free:0};
  $('#groups').innerHTML=GROUPS.map(g=>{
    let used=0,free=0,picked=0;
    const cells=Array.from({length:16},(_,i)=>{
      const slot=g+(i+1),k=key(cur,slot),r=rows[k],st=state(r);c[st]++;
      if(st!=='free')used++;else{free++;if(sel.has(k))picked++}
      const on=sel.has(k);
      const lab=`${slot} ${on?'선택됨':LABEL[st]}${r?', '+r.name:''}`;
      return `<button class="slot ${st}${on?' sel':''}" data-slot="${slot}" aria-pressed="${st==='free'?on:'false'}" aria-label="${esc(lab)}"><span class="n">${slot}</span><span class="who">${r?esc(r.name):''}</span></button>`;
    }).join('');
    const all=free>0&&picked===free;
    return `<div class="grp"><h3>그룹 ${g}<small>${used}/16</small></h3><div class="grid">${cells}</div>${free?`<button class="gsel" data-g="${g}">${all?'선택 해제':'빈 칸 모두 선택'}</button>`:'<p class="gfull">빈 칸 없음</p>'}</div>`;
  }).join('');
  $('#pcount').textContent=`${64-c.free} / 64 칸 점유`;
  $('#sum').innerHTML=`<span><i class="dot d-use"></i><b>${c.use}</b>사용 중</span><span><i class="dot d-soon"></i><b>${c.soon}</b>예약</span><span><i class="dot d-exp"></i><b>${c.exp}</b>기간 만료</span><span><i class="dot d-free"></i><b>${c.free}</b>비어 있음</span>`;
  renderBar();renderList();
}
function renderBar(){
  const b=$('#bar');
  if(!sel.size){b.hidden=true;document.body.classList.remove('hasbar');return}
  b.hidden=false;document.body.classList.add('hasbar');
  $('#bartxt').innerHTML=`<b>${sel.size}칸 선택</b><span>${esc(describe([...sel]))}</span>`;
}
function renderList(){
  const q=$('#q').value.trim().toLowerCase(),all=$('#allkb').checked,hx=$('#hideexp').checked;
  const order={use:0,soon:1,exp:2};
  /* 같은 묶음은 한 줄로 */
  const groups={};
  Object.entries(rows).forEach(([k,r])=>{const g=r.batch?'b:'+r.batch:'k:'+k;(groups[g]=groups[g]||{r,keys:[]}).keys.push(k)});
  const list=Object.values(groups).map(({r,keys})=>{
    const ks=keys.filter(k=>all||split(k).kb===cur);
    return{r,keys:ks,st:state(r),txt:describe(ks)};
  }).filter(x=>x.keys.length&&!(hx&&x.st==='exp'))
    .filter(x=>!q||[x.r.name,x.r.purpose,x.txt].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>order[a.st]-order[b.st]||(a.r.end||'').localeCompare(b.r.end||'')||a.txt.localeCompare(b.txt));
  if(!list.length){$('#list').innerHTML=`<p class="empty">${Object.keys(rows).length?'조건에 맞는 예약이 없어요.':'아직 예약이 없어요. 위 패널에서 빈 칸을 골라 첫 예약을 해 보세요.'}</p>`;return}
  $('#list').innerHTML=`<table class="stack"><thead><tr><th>상태</th><th>슬롯</th><th>칸 수</th><th>사용자</th><th>목적</th><th>기간</th></tr></thead><tbody>${
    list.map(x=>`<tr data-k="${esc(x.keys[0])}"><td><span class="tag t-${x.st}">${LABEL[x.st]}</span></td><td>${esc(x.txt)}</td><td class="nw">${x.keys.length}칸</td><td>${esc(x.r.name)}</td><td>${esc(x.r.purpose)}</td><td class="nw">${fmt(x.r.start)} ~ ${fmt(x.r.end)}</td></tr>`).join('')
  }</tbody></table>`;
}

/* ---- 대화 상자 ---- */
let lastFocus=null;
function show(){if($('#ov').hidden)lastFocus=document.activeElement;$('#ov').hidden=false;($('#dlg input:not([type=checkbox])')||$('#dlg .btn.pri')||$('#dlg button')).focus()}
function close(){$('#ov').hidden=true;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
const headFor=(title,meta)=>`<h3 id="dt">${title}</h3><p class="meta">${meta}</p>`;
/** 묶음이 여러 칸이면 "함께 예약한 칸 모두" 체크박스 */
const groupChk=(k,verb)=>{const cs=companions(k);return cs.length>1?`<label class="chk"><input type="checkbox" id="fall" checked> 함께 예약한 ${cs.length}칸 모두 ${verb} <small>(${esc(describe(cs))})</small></label>`:''};
const targetKeys=k=>$('#fall')?.checked?companions(k):[k];

function openSlot(k){
  const r=rows[k];if(!r)return;
  const {kb,slot}=split(k),st=state(r),cs=companions(k),ed=API.canEdit(r);
  $('#dlg').innerHTML=headFor(`${KB[kb]} · ${slot}`,LABEL[st])+`<div class="view"><dl><dt>사용자</dt><dd>${esc(r.name)}</dd><dt>목적</dt><dd>${esc(r.purpose)}</dd><dt>기간</dt><dd>${esc(r.start)} ~ ${esc(r.end)}</dd>${cs.length>1?`<dt>함께 예약</dt><dd>${cs.length}칸 · ${esc(describe(cs))}</dd>`:''}</dl></div>
    <div class="acts">${st==='exp'?'<button class="btn del" id="bclr">비우기</button>':''}${ed?'<button class="btn del" id="bdel">예약 취소</button><button class="btn" id="bedit">수정</button>':''}<button class="btn pri" id="bclose">닫기</button></div>
    ${!ed&&st!=='exp'?'<p class="note">예약한 사람만 수정·취소할 수 있어요.</p>':''}`;
  $('#bclose').onclick=close;
  if($('#bedit'))$('#bedit').onclick=()=>showForm(k);
  if($('#bdel'))$('#bdel').onclick=()=>confirmDel(k);
  if($('#bclr'))$('#bclr').onclick=()=>confirmClear(k);
  show();
}
function confirmDel(k){
  const {kb,slot}=split(k);
  $('#dlg').innerHTML=headFor(`${KB[kb]} · ${slot}`,'예약 취소')+`<form id="f" novalidate><p>예약을 취소할까요? 되돌릴 수 없어요.</p>${groupChk(k,'취소')}${API.pin?pinField('fpin','예약 PIN 4자리'):''}<p class="err" id="err"></p>
    <div class="acts"><button type="button" class="btn" id="bno">돌아가기</button><button class="btn pri" id="bs">예약 취소</button></div></form>`;
  $('#bno').onclick=()=>openSlot(k);
  submit(()=>API.cancel(targetKeys(k),$('#fpin')?.value),()=>API.pin&&!/^\d{4}$/.test($('#fpin').value)?'PIN 4자리를 입력해 주세요.':'');
  show();
}
function confirmClear(k){
  const {kb,slot}=split(k);
  $('#dlg').innerHTML=headFor(`${KB[kb]} · ${slot}`,'기간 만료')+`<form id="f" novalidate><p>기간이 끝난 예약이에요. 칸을 비울까요? 되돌릴 수 없어요.</p>${groupChk(k,'비우기')}<p class="err" id="err"></p>
    <div class="acts"><button type="button" class="btn" id="bno">돌아가기</button><button class="btn pri" id="bs">비우기</button></div></form>`;
  $('#bno').onclick=()=>openSlot(k);
  submit(()=>API.clear(targetKeys(k).filter(x=>state(rows[x])==='exp')),()=>'');
  show();
}
/** k가 있으면 수정, 없으면 선택한 칸들 새 예약 */
function showForm(k){
  const r=k?rows[k]:null,keys=r?null:[...sel].sort();
  const title=r?`${KB[split(k).kb]} · ${split(k).slot}`:`${keys.length}칸 예약`;
  const meta=r?'예약 수정':esc(describe(keys));
  $('#dlg').innerHTML=headFor(title,meta)+`<form id="f" novalidate>
    ${r?groupChk(k,'수정'):''}
    <label class="fld"><span>사용자 이름</span><input id="fn" required maxlength="30" value="${esc(r?.name)}" autocomplete="name"></label>
    <label class="fld"><span>사용 목적</span><input id="fp" required maxlength="40" value="${esc(r?.purpose)}" placeholder="직접 입력하거나 아래에서 고르세요">
      <div class="chips">${PURPOSES.map(p=>`<button type="button" data-p="${p}">${p}</button>`).join('')}</div></label>
    <div class="row2"><label class="fld"><span>시작일</span><input type="date" id="fs" required value="${esc(r?.start||today())}"></label>
    <label class="fld"><span>종료일</span><input type="date" id="fe" required value="${esc(r?.end||'')}"></label></div>
    ${API.pin?(r?pinField('fpin','예약 PIN 4자리'):pinField('fpin','PIN 4자리 정하기')+'<p class="note" style="margin:-6px 0 14px">선택한 칸 모두에 같은 PIN이 쓰여요. 수정·취소할 때 필요해요.</p>'):''}
    <p class="err" id="err"></p>
    <div class="acts"><button type="button" class="btn" id="bc">취소</button><button class="btn pri" id="bs">${r?'수정 저장':keys.length+'칸 예약하기'}</button></div></form>`;
  if(!r){try{const n=localStorage.getItem('sp7name');if(n)$('#fn').value=n}catch(e){}}
  $('#dlg').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#fp').value=b.dataset.p});
  $('#bc').onclick=()=>r?openSlot(k):close();
  const val=()=>{
    const name=$('#fn').value.trim(),purpose=$('#fp').value.trim(),start=$('#fs').value,end=$('#fe').value;
    if(!name||!purpose||!start||!end)return'이름, 목적, 기간을 모두 채워 주세요.';
    if(end<start)return'종료일이 시작일보다 빠를 수 없어요.';
    if(API.pin&&!/^\d{4}$/.test($('#fpin').value))return'PIN은 숫자 4자리예요.';
    if(!r){const taken=keys.filter(x=>rows[x]);if(taken.length)return`이미 예약된 칸이 있어요: ${describe(taken)}`}
    return'';
  };
  submit(async()=>{
    const data={name:$('#fn').value.trim(),purpose:$('#fp').value.trim(),start:$('#fs').value,end:$('#fe').value,pin:$('#fpin')?.value};
    const j=r?await API.update(targetKeys(k),data):await API.reserve(keys,data);
    if(j.ok){try{localStorage.setItem('sp7name',data.name)}catch(e){}if(!r){sel.clear();render()}}
    return j;
  },val);
  show();
}
function submit(run,check){
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const msg=check();if(msg){$('#err').textContent=msg;return}
    const b=$('#bs'),t=b.textContent;b.disabled=true;b.textContent='처리 중…';$('#err').textContent='';
    let j;try{j=await run()}catch(err){j={ok:false,error:'처리하지 못했어요. 연결을 확인해 주세요.'}}
    if(j.ok)close();else{$('#err').textContent=j.error||'처리하지 못했어요.';b.disabled=false;b.textContent=t}
  };
}

/* ---- 이벤트 ---- */
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.kb;render()}};
$('#groups').onclick=e=>{
  if(!ready){status('아직 불러오는 중이에요. 잠시 후 다시 눌러 주세요.');return}
  const g=e.target.closest('.gsel');
  if(g){
    const free=Array.from({length:16},(_,i)=>key(cur,g.dataset.g+(i+1))).filter(k=>!rows[k]);
    const all=free.every(k=>sel.has(k));free.forEach(k=>all?sel.delete(k):sel.add(k));render();return;
  }
  const b=e.target.closest('.slot');if(!b)return;
  const k=key(cur,b.dataset.slot);
  if(rows[k])openSlot(k);else{sel.has(k)?sel.delete(k):sel.add(k);render();const n=document.querySelector(`.slot[data-slot="${b.dataset.slot}"]`);if(n)n.focus()}
};
$('#bclear').onclick=()=>{sel.clear();render()};
$('#bres').onclick=()=>{if(sel.size)showForm(null)};
$('#list').onclick=e=>{const tr=e.target.closest('tr[data-k]');if(tr){const k=tr.dataset.k,{kb}=split(k);if(kb!==cur){cur=kb;render()}openSlot(k)}};
['q','allkb','hideexp'].forEach(id=>$('#'+id).addEventListener('input',renderList));
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)close()});

render();
API.init();

}
</script>
</body>
</html>
